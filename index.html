<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Computers | Premium Custom PC Boutique & Technical Architecture</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --panel-bg: #0d1117;
            --accent-glow: #0071e3;
            --accent-success: #30d5c8;
            --text-light: #ffffff;
            --text-gray: #8b949e;
            --border-color: #21262d;
            --input-bg: #161b22;
        }
        * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; line-height: 1.6; }
        header { text-align: center; padding: 4rem 2rem; background: linear-gradient(180deg, #161b22 0%, var(--bg-dark) 100%); border-bottom: 1px solid var(--border-color); }
        .logo-img { max-height: 120px; width: auto; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 113, 227, 0.25); border: 2px solid var(--accent-glow); padding: 0.5rem; background: var(--panel-bg); }
        h1 { font-size: 3rem; font-weight: 800; margin: 0; background: linear-gradient(120deg, #ffffff 40%, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-container { max-width: 1050px; width: 92%; margin: 3rem auto; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 2rem; margin-bottom: 4rem; }
        .service-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2.2rem; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .service-card:hover { transform: translateY(-5px); border-color: var(--accent-glow); }
        .badge { font-size: 0.75xl; font-weight: 700; text-transform: uppercase; color: var(--accent-glow); background: rgba(0, 113, 227, 0.1); padding: 0.3rem 0.8rem; border-radius: 20px; display: inline-block; margin-bottom: 1.2rem; }
        .card-bottom { margin-top: 2rem; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 1.2rem; }
        .price-text { font-size: 1.5rem; font-weight: 800; color: var(--accent-success); }
        .order-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2.5rem; margin-bottom: 5rem; }
        .field-block { display: flex; flex-direction: column; margin-bottom: 1.5rem; }
        .field-block input, .field-block textarea { background-color: var(--input-bg); border: 1px solid #30363d; border-radius: 6px; padding: 1rem; color: var(--text-light); font-size: 1rem; }
        .submit-trigger { background: linear-gradient(180deg, #1f6feb 0%, #0e56c5 100%); border: 1px solid #388bfd; color: var(--text-light); padding: 1.3rem 2.5rem; font-size: 1.15rem; font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%; text-transform: uppercase; }
        footer { text-align: center; padding: 3rem; color: var(--text-gray); border-top: 1px solid var(--border-color); background-color: #0d1117; }
    </style>
</head>
<body>
    <header>
        <div class="logo-box"><img src="logo.png" alt="DML Logo" class="logo-img"></div>
        <h1>DML COMPUTERS</h1>
        <p>Premium Custom Systems // Certified Hardware Engineering</p>
    </header>
    <div class="main-container">
        <h2>Select a Custom Configuration Service</h2>
        <div class="services-grid">
            <div class="service-card" onclick="applyServiceModule('Custom Workstation Deployment', 95.00, 'BUILD SPEC...')">
                <div><span class="badge">Hardware Assembly</span><h3>Custom Workstation Build</h3><p>Complete multi-component staging and testing.</p></div>
                <div class="card-bottom"><div class="price-text">£95.00</div></div>
            </div>
        </div>
        <h2>Configure & Launch Secure Request</h2>
        <div class="order-panel">
            <div class="field-block"><label>Name</label><input type="text" id="user-name" required></div>
            <div class="field-block"><label>Email</label><input type="email" id="user-email" required></div>
            <div class="field-block"><label>Specs</label><textarea id="user-specs" rows="6" required></textarea></div>
            <button type="button" class="submit-trigger" onclick="processPurchaseSequence()">Process Order</button>
        </div>
    </div>
    <footer><p>&copy; 2026 DML Computers.</p></footer>
    <script>
        let rawNumericalPrice = 95.00;
        function applyServiceModule(title, cost, blueprint) {
            document.getElementById("user-specs").value = `${title}\n${blueprint}`;
        }
        function processPurchaseSequence() {
            const name = document.getElementById("user-name").value;
            const email = document.getElementById("user-email").value;
            window.location.href = `mailto:dlester626@://gmail.com{name} (${email})`;
            window.open(`https://paypal.com{rawNumericalPrice.toFixed(2)}`, '_blank');
        }
    </script>
</body>
</html>
