<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Computers | Premium Cybernetic Architecture & IT</title>
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #101520;
            --accent-blue: #1793d1; /* Arch Linux Core Blue */
            --accent-green: #00ff66; /* Cyber Neon Green */
            --text-main: #f0f3f6;
            --text-muted: #5c6773;
            --terminal-bg: #05070a;
            --border-color: #1a2436;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 3rem 1rem;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #0d131f 0%, var(--bg-color) 100%);
            box-sizing: border-box;
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-img {
            max-height: 140px;
            width: auto;
            border-radius: 6px;
            border: 1px dashed var(--accent-blue);
            padding: 0.8rem;
            background-color: var(--terminal-bg);
            box-shadow: 0 0 20px rgba(23, 147, 209, 0.15);
        }

        header h1 {
            color: var(--accent-blue);
            margin: 0;
            font-size: 3rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(23, 147, 209, 0.3);
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.6rem;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            width: 90%;
            margin: 2rem auto;
        }

        h2 {
            color: var(--accent-blue);
            border-left: 4px solid var(--accent-blue);
            padding-left: 12px;
            letter-spacing: 2px;
            font-size: 1.5rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* Futuristic Clickable Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-sizing: border-box;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-blue);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 20px rgba(23, 147, 209, 0.1);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card h3 {
            color: var(--text-main);
            margin-top: 0;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .card p {
            color: #b2ccd6;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .status-tag {
            background-color: rgba(23, 147, 209, 0.1);
            color: var(--accent-blue);
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(23, 147, 209, 0.2);
        }

        .price-tag {
            font-size: 1.4rem;
            color: var(--accent-green);
            margin-top: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .click-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card:hover .click-hint {
            color: var(--accent-green);
        }

        /* Live Core Terminal */
        .terminal-box {
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 3rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-r { background-color: #ff5f56; }
        .dot-y { background-color: #ffbd2e; }
        .dot-g { background-color: #27c93f; }

        .terminal-output {
            color: var(--accent-green);
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        /* Ticket & Form Matrix */
        .form-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2.5rem;
            margin-bottom: 4rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--accent-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(23, 147, 209, 0.1);
        }

        .btn-wrapper {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        button.primary-btn {
            background-color: rgba(23, 147, 209, 0.05);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 1rem 2rem;
            font-family: monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button.primary-btn:hover {
            background-color: rgba(23, 147, 209, 0.15);
            box-shadow: 0 0 15px rgba(23, 147, 209, 0.2);
        }

        a.secondary-btn {
            background-color: rgba(0, 255, 102, 0.02);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 1rem 2rem;
            font-family: monospace;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        a.secondary-btn:hover {
            background-color: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
        }

        footer {
            margin-top: auto;
            padding: 2.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 100%;
            border-top: 1px solid var(--border-color);
            background-color: #070b10;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

        <div class="logo-container">
            <img src="logo.png" alt="DML Computers Logo" class="logo-img">
        </div>
        <h1>DML COMPUTERS</h1>
        <p>[ System Architecture Core Node // Active Status: ONLINE ]</p>
    </header>
