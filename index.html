<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Computers | Custom PC Workstations & Expert Repairs</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --panel-bg: #0d1117;
            --accent-glow: #0071e3;
            --accent-success: #30d5c8;
            --text-light: #ffffff;
            --text-gray: #8b949e;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); margin: 0; line-height: 1.6; }
        header { text-align: center; padding: 4rem 2rem; background: linear-gradient(180deg, #161b22 0%, var(--bg-dark) 100%); border-bottom: 1px solid #21262d; }
        .logo-img { max-height: 110px; border-radius: 8px; border: 2px solid var(--accent-glow); padding: 0.5rem; background: #0d1117; }
        h1 { font-size: 2.8rem; font-weight: 800; margin: 0; }
        .main-container { max-width: 1000px; width: 90%; margin: 3rem auto; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 4rem; }
        .service-card { background-color: var(--panel-bg); border: 1px solid #21262d; border-radius: 12px; padding: 2rem; cursor: pointer; transition: 0.25s; }
        .service-card:hover { border-color: var(--accent-glow); transform: translateY(-4px); }
        .order-panel { background-color: var(--panel-bg); border: 1px solid #21262d; border-radius: 12px; padding: 2.5rem; margin-bottom: 5rem; }
        .field-block { display: flex; flex-direction: column; margin-bottom: 1.5rem; }
        .field-block input, .field-block textarea { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.9rem; color: var(--text-light); font-family: inherit; }
        .submit-trigger { background: #1f6feb; color: var(--text-light); padding: 1.2rem; border-radius: 6px; border: none; cursor: pointer; width: 100%; font-weight: 700; text-transform: uppercase; }
        footer { text-align: center; padding: 3rem; color: var(--text-gray); border-top: 1px solid #21262d; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo" class="logo-img">
        <h1>DML COMPUTERS</h1>
        <p>Premium Custom Workstations & Certified Hardware Architecture</p>
    </header>
    <div class="main-container">
        <h2>Select a Custom Configuration Service</h2>
        <div class="services-grid">
            <div class="service-card" onclick="applyBuildTemplate('Custom Workstation Build', 'Motherboard: \nCPU: \nGPU: ')">
                <h3>Custom Workstation Build</h3>
                <p>Complete multi-component staging and benchmarking.</p>
            </div>
        </div>
        <h2>Configure & Launch Service Request</h2>
        <div class="order-panel" id="order-form-block">
            <div class="field-block"><input type="text" id="user-name" placeholder="Full Name" required></div>
            <div class="field-block"><input type="email" id="user-email" placeholder="Email" required></div>
            <div class="field-block"><textarea id="user-specs" rows="6" placeholder="Specifications" required></textarea></div>
            <button type="button" class="submit-trigger" onclick="compileAndLaunchEmail()">Launch Order Ticket via Email</button>
        </div>
    </div>
    <script>
        function applyBuildTemplate(title, specs) {
            document.getElementById("user-specs").value = `${title}\n${specs}`;
        }
        function compileAndLaunchEmail() {
            const name = document.getElementById("user-name").value;
            const email = document.getElementById("user-email").value;
            const specs = document.getElementById("user-specs").value;
            window.location.href = `mailto:dlester626@://gmail.com{encodeURIComponent(name + '\n' + email + '\n' + specs)}`;
        }
    </script>
</body>
</html>
