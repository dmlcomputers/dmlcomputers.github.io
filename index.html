    <style>
        :root {
            --color-bg-deep: #020408;
            --color-bg-panel: rgba(13, 17, 23, 0.75);
            --color-accent-neon: #00f0ff;
            --color-accent-laser: #ff0055;
            --color-matrix-green: #39ff14;
            --color-text-bright: #f0f6fc;
            --color-text-dim: #8b949e;
            --color-border-glow: rgba(0, 240, 255, 0.2);
            --font-display: 'Orbitron', sans-serif;
            --font-terminal: 'Share Tech Mono', monospace;
            --radius-matrix: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-deep);
            color: var(--color-text-bright);
            font-family: var(--font-terminal);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Ambient Digital Grid Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #05101a 0%, var(--color-bg-deep) 100%);
        }

        header {
            text-align: center;
            padding: 4rem 2rem;
            border-bottom: 1px dashed var(--color-border-glow);
            position: relative;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--color-accent-neon), 0 0 20px rgba(0,240,255,0.5);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--color-accent-neon);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 1100px;
            width: 92%;
            margin: 3rem auto;
            position: relative;
            z-index: 10;
        }

        .app-view {
            display: none;
        }

        .app-view.active {
            display: block;
            animation: terminalBoot 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes terminalBoot {
            from { opacity: 0; transform: scale(0.98) translateY(10px); filter: blur(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            border-left: 4px solid var(--color-accent-neon);
            padding-left: 0.75rem;
        }

        /* Futuristic Selection Launchpad Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            margin-top: 1.5rem;
        }

        .service-card {
            background-color: var(--color-bg-panel);
            border: 1px solid var(--color-border-glow);
            border-radius: var(--radius-matrix);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--color-accent-neon);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0,240,255,0.1);
            transform: translateY(-2px);
        }

        .badge {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-accent-neon);
            border: 1px solid var(--color-accent-neon);
            padding: 0.25rem 0.75rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            background: rgba(0, 240, 255, 0.05);
        }

        .badge-linux {
            color: var(--color-accent-laser);
            border-color: var(--color-accent-laser);
            background: rgba(255, 0, 85, 0.05);
        }

        .service-card h3 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .service-card p {
            color: var(--color-text-dim);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--color-border-glow);
            padding-top: 1.5rem;
        }

        .price-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-matrix-green);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }

        /* Forms, Dynamic Selectors, and Input Pools */
        .panel {
            background-color: var(--color-bg-panel);
            border: 1px solid var(--color-border-glow);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            margin-top: 1.5rem;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.03);
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .config-row { grid-template-columns: 1fr; gap: 1.5rem; }
        }

        .form-block {
            display: flex;
            flex-direction: column;
        }

        .form-block label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--color-accent-neon);
            margin-bottom: 0.5rem;
            letter-spacing: 1.5px;
        }

        .form-block select, 
        .form-block input,
        .form-block textarea {
            background-color: rgba(2, 4, 8, 0.8);
            border: 1px solid var(--color-border-glow);
            border-radius: var(--radius-matrix);
            padding: 0.9rem;
            color: var(--color-text-bright);
            font-family: var(--font-terminal);
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .form-block select:focus, 
        .form-block input:focus,
        .form-block textarea:focus {
            outline: none;
            border-color: var(--color-accent-neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .form-block input[readonly] {
            background-color: transparent;
            color: var(--color-matrix-green);
            font-weight: 700;
            border-style: dashed;
            font-size: 1.25rem;
            text-shadow: 0 0 5px rgba(57,255,20,0.4);
        }

        /* Action Buttons */
        .footer-action-bar {
            display: flex;
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .btn {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 1rem 2rem;
            border-radius: var(--radius-matrix);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.25s ease;
            position: relative;
        }

        .btn-primary {
            background-color: transparent;
            border: 1px solid var(--color-accent-neon);
            color: var(--color-accent-neon);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-primary:hover {
            background-color: var(--color-accent-neon);
            color: var(--color-bg-deep);
            box-shadow: 0 0 20px var(--color-accent-neon);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--color-text-dim);
            color: var(--color-text-dim);
        }

        .btn-secondary:hover {
            border-color: var(--color-text-bright);
            color: var(--color-text-bright);
        }
        
        .btn-master {
            flex: 1;
            padding: 1.25rem;
            font-size: 1.05rem;
        }

        /* Printable Receipt/Invoice Layout */
        .receipt-frame {
            background: #0d1117;
            color: var(--color-text-bright);
            padding: 3.5rem;
