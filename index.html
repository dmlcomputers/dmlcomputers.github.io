<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Computers | Terminal Hardware Matrix</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-deep: #020408;
            --color-bg-panel: rgba(13, 17, 23, 0.85);
            --color-accent-neon: #00f0ff;
            --color-accent-laser: #ff0055;
            --color-matrix-green: #39ff14;
            --color-text-bright: #f0f6fc;
            --color-text-dim: #8b949e;
            --color-border-glow: rgba(0, 240, 255, 0.2);
            --font-display: 'Orbitron', sans-serif;
            --font-terminal: 'Share Tech Mono', monospace;
            --radius-matrix: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--color-bg-deep);
            color: var(--color-text-bright);
            font-family: var(--font-terminal);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: block;
        }

        header {
            text-align: center;
            padding: 3rem 2rem;
            border-bottom: 1px dashed var(--color-border-glow);
            position: relative;
            background: linear-gradient(180deg, rgba(13,17,23,0.6) 0%, transparent 100%);
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 2.75rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--color-accent-neon), 0 0 20px rgba(0,240,255,0.3);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--color-accent-neon);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 1000px;
            width: 92%;
            margin: 2.5rem auto;
            position: relative;
            z-index: 10;
        }

        .app-view { display: none; }
        .app-view.active { display: block; animation: terminalBoot 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

        @keyframes terminalBoot {
            from { opacity: 0; transform: scale(0.99) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            border-left: 4px solid var(--color-accent-neon);
            padding-left: 0.75rem;
            color: #fff;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 1.5rem;
        }

        .service-card {
            background-color: var(--color-bg-panel);
            border: 1px solid var(--color-border-glow);
            border-radius: var(--radius-matrix);
            padding: 2.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.03);
            transition: all 0.25s ease-in-out;
        }

        .service-card:hover {
            border-color: var(--color-accent-neon);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0,240,255,0.05);
            transform: translateY(-2px);
        }

        .badge {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-accent-neon);
            border: 1px solid var(--color-accent-neon);
            padding: 0.25rem 0.65rem;
            margin-bottom: 1.25rem;
            display: inline-block;
            background: rgba(0, 240, 255, 0.05);
        }

        .badge-linux {
            color: var(--color-accent-laser);
            border-color: var(--color-accent-laser);
            background: rgba(255, 0, 85, 0.05);
        }

        .service-card h3 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .service-card p { color: var(--color-text-dim); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6; }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--color-border-glow);
            padding-top: 1.25rem;
        }

        .price-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--color-matrix-green);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
        }

        .panel {
            background-color: var(--color-bg-panel);
            border: 1px solid var(--color-border-glow);
            backdrop-filter: blur(8px);
            padding: 2.25rem;
            margin-top: 1.5rem;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) { .config-row { grid-template-columns: 1fr; gap: 1.25rem; } }

        .form-block { display: flex; flex-direction: column; }
        .form-block label { font-size: 0.8rem; text-transform: uppercase; color: var(--color-accent-neon); margin-bottom: 0.5rem; letter-spacing: 1.5px; }

        .form-block select, .form-block input, .form-block textarea {
            background-color: rgba(2, 4, 8, 0.85);
            border: 1px solid var(--color-border-glow);
            border-radius: var(--radius-matrix);
            padding: 0.85rem;
            color: var(--text-light, #fff);
            font-family: var(--font-terminal);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .form-block select:focus, .form-block input:focus, .form-block textarea:focus {
            outline: none; border-color: var(--color-accent-neon); box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .form-block input[readonly] {
            background-color: transparent; color: var(--color-matrix-green); font-weight: 700; border-style: dashed; font-size: 1.2rem; text-shadow: 0 0 5px rgba(57,255,20,0.3);
        }

        .footer-action-bar { display: flex; gap: 1.5rem; margin-top: 2.5rem; }

        .btn {
            font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; letter-spacing: 2px;
            padding: 0.9rem 1.75rem; border-radius: var(--radius-matrix); cursor: pointer; text-transform: uppercase; transition: all 0.2s ease;
        }

        .btn-primary { background-color: transparent; border: 1px solid var(--color-accent-neon); color: var(--color-accent-neon); box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.08); }
        .btn-primary:hover { background-color: var(--color-accent-neon); color: var(--color-bg-deep); box-shadow: 0 0 15px var(--color-accent-neon); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--color-text-dim); color: var(--color-text-dim); }
        .btn-secondary:hover { border-color: var(--color-text-bright); color: var(--color-text-bright); }
        .btn-master { flex: 1; padding: 1.15rem; }

        .receipt-frame {
            background: #0d1117; color: var(--color-text-bright); padding: 3rem;
            border: 1px solid var(--color-accent-neon); max-width: 700px; margin: auto; box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .receipt-header { text-align: center; border-bottom: 1px dashed var(--color-border-glow); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .receipt-header h2 { border: none; padding: 0; display: inline-block; font-size: 1.5rem; text-shadow: 0 0 10px var(--color-accent-neon); }
        .receipt-header p { font-size: 0.85rem; color: var(--color-text-dim); margin-top: 0.25rem; }

        .receipt-info-box {
            margin-top: 1.25rem; text-align: left; padding: 1rem; background: rgba(2, 4, 8, 0.5);
            border: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; line-height: 1.5;
        }

        .receipt-line { display: flex; justify-content: space-between; margin: 0.75rem 0; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 0.25rem; }
        .receipt-total { border-top: 1px dashed var(--color-accent-neon); font-size: 1.3rem; font-weight: 700; color: var(--color-matrix-green); padding-top: 1.25rem; margin-top: 1.25rem; }

        @media print {
            #bg-canvas, .footer-action-bar, h2 { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .receipt-frame { border: 1px solid #000; background: #fff; color: #000; box-shadow: none; padding: 1rem; max-width: 100%; }
            .receipt-line { border-bottom: 1px solid #ccc; color: #000; }
Use code with caution.

}
